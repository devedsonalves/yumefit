services:
  database-test:
    image: postgres:17-alpine
    container_name: yumefit-db-test
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: yumefit_test
      POSTGRES_PASSWORD: yumefit_test_password
      POSTGRES_DB: yumefit_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yumefit_test -d yumefit_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis-test:
    image: redis:7-alpine
    container_name: yumefit-redis-test
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
